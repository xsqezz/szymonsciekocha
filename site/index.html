<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>Twoje IP — Szymon pozdrawia</title>
    <style>
      :root {
        color-scheme: light;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #171717;
        background: #ffffff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        display: grid;
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        padding: 24px;
        place-items: center;
        background: #ffffff;
      }

      main {
        width: min(100%, 640px);
      }

      .card {
        padding: clamp(28px, 7vw, 54px);
        border: 1px solid #e6eaf1;
        border-radius: 28px;
        background: #ffffff;
        text-align: center;
        box-shadow: 0 18px 54px rgba(28, 47, 79, 0.09);
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        margin: 0 0 22px;
        color: #667085;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.11em;
        text-transform: uppercase;
      }

      .eyebrow::before {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #3673e8;
        content: "";
      }

      h1 {
        margin: 0 0 18px;
        font-size: clamp(1.8rem, 5vw, 2.7rem);
        font-weight: 700;
        line-height: 1.15;
        letter-spacing: -0.045em;
      }

      .ip-box {
        display: inline-block;
        max-width: 100%;
        padding: 12px 16px;
        border: 1px solid #dce6fb;
        border-radius: 14px;
        background: #f5f8ff;
        color: #2457d6;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: clamp(1rem, 4.6vw, 1.5rem);
        font-weight: 700;
        line-height: 1.45;
        overflow-wrap: anywhere;
        font-variant-numeric: tabular-nums;
      }

      #ip {
        overflow-wrap: anywhere;
      }

      .greeting {
        max-width: 32ch;
        margin: 26px auto 0;
        font-size: clamp(1.1rem, 3.3vw, 1.4rem);
        font-weight: 600;
        line-height: 1.45;
        letter-spacing: -0.02em;
      }

      @media (max-width: 420px) {
        body {
          padding: 18px;
        }

        .card {
          padding: 32px 20px;
          border-radius: 22px;
        }

        .ip-box {
          padding: 11px 12px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="card">
        <p class="eyebrow">Twój publiczny adres IP</p>
        <h1>Twoje IP to</h1>
        <div class="ip-box">(<span id="ip" aria-live="polite">pobieram…</span>)</div>
        <p class="greeting">Szymon pozdrawia i serdecznie dziękuję</p>
      </article>
    </main>

    <script>
      async function showVisitorIp() {
        const ipElement = document.getElementById("ip");

        try {
          const response = await fetch("https://api.ipify.org?format=json", {
            cache: "no-store",
          });

          if (!response.ok) {
            throw new Error("IP service request failed");
          }

          const result = await response.json();
          if (typeof result.ip !== "string" || result.ip.length > 64) {
            throw new Error("IP service returned an invalid response");
          }

          ipElement.textContent = result.ip;
        } catch {
          ipElement.textContent = "nie udało się pobrać";
        }
      }

      showVisitorIp();
    </script>
  </body>
</html>
